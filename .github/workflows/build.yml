name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]  # Release criada pela página do GitHub

permissions:
  contents: write

# A mesma tag pode disparar o push e o release: um de cada vez.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pacote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo e tags, para montar o changelog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Confere a sintaxe no Python mais antigo suportado
        run: python -m compileall -q main.py src macros
      - name: Monta o zip
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path horsch-terminal.cmd, main.py, src, macros -DestinationPath dist/horsch-terminal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: horsch-terminal
          path: dist/horsch-terminal.zip
      - name: Publica no release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python .github/changelog.py "$GITHUB_REF_NAME" notas.md
          # Tags com sufixo (v0.10.3-alpha, v1.0.0-beta.1...) saem como pré-lançamento.
          previa=""
          case "$GITHUB_REF_NAME" in *-*) previa="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release já criada pela página do GitHub: anexa o zip e escreve o changelog nela.
            gh release upload "$GITHUB_REF_NAME" dist/horsch-terminal.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notas.md $previa
          else
            gh release create "$GITHUB_REF_NAME" dist/horsch-terminal.zip --title "$GITHUB_REF_NAME" --notes-file notas.md $previa
          fi
        env:
          GH_TOKEN: ${{ github.token }}

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  pacote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo e tags, para montar o changelog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Confere a sintaxe no Python mais antigo suportado
        run: python -m compileall -q main.py src macros
      - name: Monta o zip
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path horsch-terminal.cmd, main.py, src, macros -DestinationPath dist/horsch-terminal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: horsch-terminal
          path: dist/horsch-terminal.zip
      - name: Publica no release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python .github/changelog.py "$GITHUB_REF_NAME" notas.md
          gh release create "$GITHUB_REF_NAME" dist/horsch-terminal.zip --title "$GITHUB_REF_NAME" --notes-file notas.md
        env:
          GH_TOKEN: ${{ github.token }}
